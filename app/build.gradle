plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.android')
}

def releaseKeystorePath = System.getenv("NEKOFLASH_RELEASE_STORE_FILE") ?: System.getenv("NEKOFLASH_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("NEKOFLASH_RELEASE_STORE_PASSWORD") ?: System.getenv("NEKOFLASH_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("NEKOFLASH_RELEASE_KEY_ALIAS") ?: System.getenv("NEKOFLASH_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NEKOFLASH_RELEASE_KEY_PASSWORD") ?: System.getenv("NEKOFLASH_KEY_PASSWORD")
def releaseSigningReady = [
        releaseKeystorePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() } &&
        file(releaseKeystorePath ?: "__missing_keystore__").isFile()

android {
    namespace = 'ru.forum.adbfastboottool'
    compileSdk = 36

    // AGP 8.x по умолчанию НЕ генерирует BuildConfig — включаем явно,
    // т.к. код использует BuildConfig.VERSION_NAME / VERSION_CODE / DEBUG.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "ru.forum.adbfastboottool"
        minSdk = 26
        targetSdk = 34
        versionCode = 226
        versionName = "6.0.0-alpha10"
        def buildCommit = (System.getenv("GITHUB_SHA") ?: System.getenv("NEKOFLASH_BUILD_COMMIT") ?: "local").trim()
        def buildRunId = (System.getenv("GITHUB_RUN_ID") ?: System.getenv("NEKOFLASH_BUILD_RUN_ID") ?: "local").trim()
        buildConfigField("String", "BUILD_COMMIT", "\"${buildCommit.replace('\\', '_').replace('\"', '_')}\"")
        buildConfigField("String", "BUILD_RUN_ID", "\"${buildRunId.replace('\\', '_').replace('\"', '_')}\"")
        buildConfigField("String", "BUILD_ID", "\"6.0.0-alpha10+${buildCommit.take(12)}.${buildRunId}\"")
        externalNativeBuild {
            cmake {
                cppFlags("-std=c++17 -Wall -Wextra -Werror")
            }
        }
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Production release signing requires all four NEKOFLASH_* variables.
            // Unsigned release packaging is blocked below before task execution.
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            minifyEnabled = false
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // targetSdk 35/36 changes window/insets and other runtime behavior. Keep the
    // proven API 34 behavior until a dedicated device-validation migration.
    lint {
        lintConfig = file("../lint.xml")
        disable('OldTargetApi')
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")
    }
}

dependencies {
    implementation('androidx.core:core-ktx:1.17.0')
    implementation('androidx.appcompat:appcompat:1.7.1')
    implementation('androidx.activity:activity-ktx:1.13.0')
    implementation('androidx.recyclerview:recyclerview:1.4.0')
    implementation('com.google.android.material:material:1.14.0')

    // ViewModel + LiveData
    implementation('androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0')
    implementation('androidx.lifecycle:lifecycle-viewmodel-savedstate:2.11.0')
    implementation('androidx.lifecycle:lifecycle-livedata-ktx:2.11.0')
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.11.0')

    // Корутины
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0')

    // Palette API — динамическое извлечение цветов из bg_welcome.jpg
    implementation('androidx.palette:palette-ktx:1.0.0')
}


// Production invariant: a release package must never be emitted unsigned.
// Debug/lint tasks remain usable without the release key.
gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested =
            graph.hasTask("${project.path}:assembleRelease") ||
            graph.hasTask("${project.path}:packageRelease") ||
            graph.hasTask("${project.path}:bundleRelease")

    if (releasePackagingRequested && !releaseSigningReady) {
        throw new GradleException(
                "Release packaging requires the permanent NekoFlash signing key. " +
                "Set NEKOFLASH_RELEASE_STORE_FILE, NEKOFLASH_RELEASE_STORE_PASSWORD, " +
                "NEKOFLASH_RELEASE_KEY_ALIAS and NEKOFLASH_RELEASE_KEY_PASSWORD. " +
                "Unsigned production artifacts are forbidden."
        )
    }
}
