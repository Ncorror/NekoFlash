name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Repository hygiene
        run: ./scripts/ci/check_repository_hygiene.sh

      - name: Localization contract
        run: python3 ./scripts/ci/check_localization.py

      - name: Kotlin style, complexity and module boundaries
        run: ./scripts/ci/check_kotlin_style.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify checked-in Gradle wrapper
        run: ./gradlew --version

      - name: Test, lint and build debug APK
        run: ./gradlew test lint assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
