name: Android CI

on:
  push:
    branches: [production-reset]
  pull_request:
    branches: [production-reset]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Phase 1 gates
        run: ./scripts/ci/check_all.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: NekoFlash-phase1-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification reports
        uses: actions/upload-artifact@v7
        with:
          name: NekoFlash-phase1-verification-${{ github.sha }}
          path: |
            core/model/build/test-results/test/
            core/model/build/reports/tests/test/
            core/diagnostics/build/test-results/test/
            core/diagnostics/build/reports/tests/test/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 7
