name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск: способ получить вердикт заново, не изображая изменение там,
  # где его нет. Без него единственным способом перезапустить CI остаётся пустой
  # коммит — `rerun` идущему прогону отказывает, а других триггеров не было.
  #
  # Заведён после ошибки, и ошибка стоит того, чтобы её записать: прогон 160 был
  # сочтён зависшим и отменён примерно за полминуты до нормального конца.
  # Зависания не было — ответы API про шаги отдавались устаревшими, и разница
  # между «шаг идёт» и «ответ старый» по ним не видна. Судить о ходе прогона по
  # повторным снимкам одного и того же ответа нельзя; смотреть надо на
  # `completed_at` шагов, а не на то, сколько раз ответ пришёл прежним.
  #
  # Триггер ничего не ослабляет: те же шаги, те же гейты, тот же код.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Repository hygiene
        run: ./scripts/ci/check_repository_hygiene.sh

      - name: Localization contract
        run: python3 ./scripts/ci/check_localization.py

      - name: Documentation consistency
        run: python3 ./scripts/ci/check_docs_consistency.py

      # Ненарушаемое правило №1 было единственным без гейта: все остальные
      # проверялись автоматически, а главное — вниманием человека.
      - name: No capability guards
        run: python3 ./scripts/ci/check_no_guards.py

      - name: Kotlin style, complexity and module boundaries
        run: ./scripts/ci/check_kotlin_style.sh

      # Стоит секунды и стоит перед Gradle намеренно: Compose локально не
      # собирается ничем, и обе прошлые поломки этого модуля были механическими.
      - name: Compose wiring
        run: python3 ./scripts/ci/check_compose_wiring.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify checked-in Gradle wrapper
        run: ./gradlew --version

      # Без постоянного ключа каждая сборка подписана по-новому: установить её
      # поверх прежней нельзя, приложение приходится удалять, и вместе с
      # приватным каталогом исчезает ключ хоста ADB (docs/07 §6.15).
      # Секрета может не быть — тогда шаг ничего не делает и сборка остаётся
      # прежней. Ключ пишется во временный каталог раннера и в дерево не
      # попадает.
      - name: Materialise the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "debug signing: secret is not set, the build keeps a throwaway key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/nekoflash-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "NEKOFLASH_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "debug signing: using the stable key from the repository secret"

      - name: Test, lint and build debug APK
        run: ./gradlew test lint assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
