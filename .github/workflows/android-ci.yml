name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Repository hygiene
        run: ./scripts/ci/check_repository_hygiene.sh

      - name: Localization contract
        run: python3 ./scripts/ci/check_localization.py

      - name: Kotlin style, complexity and module boundaries
        run: ./scripts/ci/check_kotlin_style.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify checked-in Gradle wrapper
        run: ./gradlew --version

      # Без постоянного ключа каждая сборка подписана по-новому: установить её
      # поверх прежней нельзя, приложение приходится удалять, и вместе с
      # приватным каталогом исчезает ключ хоста ADB (docs/07 §6.15).
      # Секрета может не быть — тогда шаг ничего не делает и сборка остаётся
      # прежней. Ключ пишется во временный каталог раннера и в дерево не
      # попадает.
      - name: Materialise the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "debug signing: secret is not set, the build keeps a throwaway key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/nekoflash-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "NEKOFLASH_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "debug signing: using the stable key from the repository secret"

      - name: Test, lint and build debug APK
        run: ./gradlew test lint assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nekoflash-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
